# Tunable parameters. Later phases read these instead of hard-coding them.

storage:
  # Hard cap on DATA_DIR. A run aborts instead of writing past this size.
  max_bytes: 2147483648

season:
  # Nightly incremental and upsert writes are limited to this season.
  current: "2026-27"

http:
  max_retries: 5
  backoff_seconds: 1.0
  delay_seconds: 0.6
  timeout_seconds: 60

archive:
  # Optional compressed play-by-play under ARCHIVE_DIR. The engine never reads it.
  save_play_by_play: false

simulation:
  runs: 10000
  # Null draws a fresh seed per game. Set an integer to reproduce a run.
  seed: null
  # Late-game intentional foul probability when defense trails in a close Q4.
  intentional_foul_prob: 0.22
  # Soft remaining-budget scale applied once when progress crosses 0.70.
  late_pace_adjust: true
  # Overdispersion: coverage comes from shoot/usage/pace — not minutes_variance.
  # Tuned 2026-10-23: post-stabilize ~0.86 PTS 10–90. Caps are 1.5×SD (max 0.60),
  # so shoot_sd must drop below 0.40 before bands actually tighten. Target ~0.80.
  player_shoot_sd: 0.32
  player_usage_sd: 0.28
  team_hot_sd: 0.05
  pace_sd: 6.5
  # Multiply sum-of-on-court ast_rates before P(assisted). Season-average rates
  # stacked in a lineup slightly overstate team assists; 0.86 centers 2025-26.
  # 1.02 drifted to ~+3.4% team AST after variance tighten; 0.99 recenters.
  assist_p_scale: 0.99
  # Fraction of live misses that become team rebounds (no player credit).
  # 2025-26 box: player REB / missed FG ≈ 0.927. Tuned with Gumbel lineups
  # (more bench → more misses) so sim team REB stays within ±3%.
  team_reb_rate: 0.115
  # Softmax sharpness for who gets a player rebound. 1.0 = raw rates;
  # >1 concentrates boards on elite rebounders (fixes post-stabilize REB/36
  # under-projection for Jokic-class players) without changing team totals.
  reb_share_power: 1.55

blending:
  season_weights:
    # 0 is the most recent season in the baseline window.
    seasons_back: [0, 1, 2, 3]
    # Tuned 2026-10-16: flatter recent-season weights beat the prior 0.50/0.25/0.15/0.10.
    weights: [0.40, 0.30, 0.20, 0.10]
  # Weight of a game played k games ago is exp(-form_decay * k). Tuned from 0.08 -> 0.04.
  form_decay: 0.04
  # Pseudo-possessions of the position prior mixed in for small samples.
  # Applied against the player's blended sample_possessions (not as a raw
  # weight next to season weights that sum to 1).
  regression_strength: 12.0
  min_games_for_form: 5
  # Scale each season's blend weight by min(1, games / this). Stops a 1-game
  # current season from taking its full 0.40 weight and wrecking FG%.
  season_reliability_games: 20

context:
  home_pace_factor: 0.012
  away_pace_factor: -0.006
  # Soft FG%/FT% edge at home (Fix 5 HCA). Relative multiplicative.
  home_fg_factor: 0.015
  away_fg_factor: -0.005
  # Roster-weighted ORtg/DRtg vs league, blended with current-season results.
  team_offense_weight: 0.40
  team_defense_weight: 0.40
  # Games of current-season results at which roster vs results are 50/50.
  team_strength_half_life: 20.0
  # Soft pull of roster DRtg toward prior-season team DRtg (defense is noisier).
  roster_defense_prior_weight: 0.35
  # Blend RAPM-implied ORtg/DRtg with prior/roster anchors.
  rapm_strength_weight: 0.55
  # Candidate ridge penalties for stint RAPM (chosen by OOS MSE).
  rapm_lambdas: [200, 500, 1000, 2000, 5000]
  rapm_box_lambda: 400
  # Kalman team ratings + rest-aware HCA (points of expected margin).
  kalman_hca_points: 2.8
  kalman_process_var: 1.5
  kalman_obs_var: 140.0
  kalman_init_var: 25.0
  both_b2b_hca_scale: 0.55
  hca_points_to_fg: 0.004
  rest_hca_curve:
    0: -2.2
    1: 0.0
    2: 0.6
    3: 0.9
    4: 1.0
  # Blend Kalman nets into team strength (alongside RAPM/roster).
  kalman_strength_weight: 0.45
  # Pseudo-FGA for Bayesian shrink of defender FG% allowed toward league.
  defender_regression_fga: 80.0
  # Scale of primary-defender FG% adjustment in the possession engine.
  defender_impact_weight: 0.55
  # Keys are rest days. 0 is a back-to-back.
  rest_day_factors:
    0: -0.030
    1: 0.000
    2: 0.010
    3: 0.015
  # Softened so stacked zone+position adjustments do not crush league FG%.
  opponent_defense_weight: 0.35
  # Soft shift from stats allowed to PG/SG/SF/PF/C vs league (stacks lightly with zone).
  opponent_position_defense_weight: 0.15
  teammate_absence_usage_share: 0.85

minutes:
  blowout_margin_threshold: 15.0
  # |margin| below this is a "close" game for rotation shortening.
  close_margin_threshold: 6.0
  foul_trouble_rate_prior: 0.08
  # Historical-scale minutes sd floor — coverage comes from possession /
  # shooting variance and lineup stints, not from inflated minutes noise.
  minutes_variance: 5.0
  min_minutes: 0.0
  max_minutes: 42.0
  # Regulation team total (5 players × 48). Sim draws are renormalized to this.
  team_minutes_target: 240.0
  # Prefer at least this many players with meaningful minutes on a healthy roster.
  min_rotation_size: 8
  # Soft cap on how many players receive regulation minutes before scaling to 240.
  max_rotation_size: 11
  # Never truncate a player projected at/above this when enforcing max_rotation.
  rotation_keep_threshold: 10.0
  # When team total > 240, zero players below this before proportional scale.
  fringe_cut_minutes: 8.0
  # After trimming ghosts, close this fraction of the remaining gap to 240.
  # 0.0 keeps Step-2-like means (best MIN MAE) once the season has games.
  normalize_gap_close: 0.0
  # When fewer than this many current-season finals exist before as_of, use
  # early_season_gap_close instead (opening night / week 1 trade rosters).
  early_season_games: 10
  # Partial close for week-1 / opening night. Full close (1.0) dumps cut
  # fringe minutes onto stars and blows past max_minutes (Cade ~48 MPG).
  early_season_gap_close: 0.55
  # Players with projected mean above this share on-court usage.
  play_threshold: 1.0
  recent_window: 10
  # When > 0, recent minutes mean weights newer games more (exp decay by age).
  recent_decay: 0.45
  starter_floor: 24.0
  bench_floor: 6.0
  # Depth-chart priors by as-of roster rank (0 = most used). Zeros at the fringe
  # so ghost DNPs are not invented and then scaled into the 240 total.
  depth_minutes: [36, 34, 32, 30, 28, 20, 14, 10, 6, 0, 0, 0, 0, 0, 0]
  # Step F: share of an OUT player's minutes that go to historical replacements
  # first; the remainder is split by current minute share among active players.
  replacement_share: 0.85
  # Recency half-life (days) when learning stint/absence rotation patterns.
  stint_recency_half_life_days: 60.0

# U8 late-season incentives — not implemented for opening night.
# Kept disabled so mid-season tanking/rest adjustments never apply.
# Step F stint rotations: substitution edges + absence minute redistribution.
# minutes_model: engine | naive_last10 | blend
#   engine = depth/rotation/Step F path; naive_last10 = last N games played;
#   blend = naive_blend * naive + (1-naive_blend) * engine.
features:
  late_season_incentives: false
  stint_rotations_step_f: true
  # Bakeoff 2025-26 full season (1314g/1000r): pure naive_last10 beat engine
  # and blend on MIN/PTS/REB/AST MAE and coverage. Keep Step F for engine path.
  minutes_model: naive_last10
  naive_blend: 0.5

outputs:
  percentiles: [10, 25, 50, 75, 90]
