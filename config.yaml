# Tunable parameters. Later phases read these instead of hard-coding them.

storage:
  # Hard cap on DATA_DIR. A run aborts instead of writing past this size.
  max_bytes: 2147483648

season:
  # Nightly incremental and upsert writes are limited to this season.
  current: "2026-27"

http:
  max_retries: 5
  backoff_seconds: 1.0
  delay_seconds: 0.6
  timeout_seconds: 60

archive:
  # Optional compressed play-by-play under ARCHIVE_DIR. The engine never reads it.
  save_play_by_play: false

simulation:
  runs: 10000
  # Null draws a fresh seed per game. Set an integer to reproduce a run.
  seed: null

blending:
  season_weights:
    # 0 is the most recent season in the baseline window.
    seasons_back: [0, 1, 2, 3]
    # Tuned 2026-10-16: flatter recent-season weights beat the prior 0.50/0.25/0.15/0.10.
    weights: [0.40, 0.30, 0.20, 0.10]
  # Weight of a game played k games ago is exp(-form_decay * k). Tuned from 0.08 -> 0.04.
  form_decay: 0.04
  # Pseudo-possessions of the position prior mixed in for small samples.
  regression_strength: 12.0
  min_games_for_form: 5

context:
  home_pace_factor: 0.010
  away_pace_factor: -0.005
  # Keys are rest days. 0 is a back-to-back.
  rest_day_factors:
    0: -0.030
    1: 0.000
    2: 0.010
    3: 0.015
  # Softened so stacked zone+position adjustments do not crush league FG%.
  opponent_defense_weight: 0.35
  # Soft shift from stats allowed to PG/SG/SF/PF/C vs league (stacks lightly with zone).
  opponent_position_defense_weight: 0.15
  teammate_absence_usage_share: 0.85

minutes:
  blowout_margin_threshold: 15.0
  foul_trouble_rate_prior: 0.08
  minutes_variance: 4.5
  min_minutes: 0.0
  max_minutes: 42.0
  # Regulation team total (5 players × 48). Sim draws are renormalized to this.
  team_minutes_target: 240.0
  # Prefer at least this many players with meaningful minutes on a healthy roster.
  min_rotation_size: 9
  # Soft cap on how many players receive regulation minutes before scaling to 240.
  max_rotation_size: 11
  # Players with projected mean above this share on-court usage.
  play_threshold: 1.0
  recent_window: 10
  # When > 0, recent minutes mean weights newer games more (exp decay by age).
  recent_decay: 0.45
  starter_floor: 24.0
  bench_floor: 6.0
  # Depth-chart priors by as-of roster rank (0 = most appearances).
  depth_minutes: [34, 32, 30, 28, 26, 22, 18, 14, 10, 6, 3, 0, 0, 0, 0]

outputs:
  percentiles: [10, 25, 50, 75, 90]
