[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-sim"
version = "0.1.0"
description = "NBA Monte Carlo simulation engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1.0",
  "nba_api>=1.5.0",
  "numpy>=2.0",
  "pbpstats>=1.3.0",
  "pypdf>=5.0",
  "pyarrow>=16.0.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["nba_sim*", "ingest*", "projections*", "sim*", "outputs*", "backtest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
